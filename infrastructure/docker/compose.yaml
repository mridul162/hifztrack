services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hifztrack
      POSTGRES_USER: hifztrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hifztrack -d hifztrack"]
      interval: 5s
      timeout: 8s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://hifztrack:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/hifztrack
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SECURITY_SECRET_KEY: ${SECURITY_SECRET_KEY:?Set SECURITY_SECRET_KEY in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
      - ../../data/quran/source/arabic:/app/data/quran/source/arabic:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 8s
      retries: 5

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    name: hifztrack_f0a_postgres_data
